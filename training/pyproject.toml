[project]
name = "fenrir-training"
version = "0.0.1"
authors = [
  { name="Jost Triller", email="tsoj.tsoj@gmx.de" },
]
description = "Training and export for the FENrir chess diagram models"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "Pillow",
  "numpy",
  "scikit-image",
  "opencv-python>=4.13.0.92",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
# Training only — not needed for inference.
# Pick exactly one when running uv sync for training:
#   uv sync --extra train-cpu    → CPU
#   uv sync --extra train-cuda   → CUDA 12.8  (NVIDIA GPUs)
#   uv sync --extra train-rocm   → ROCm 6.4   (AMD GPUs, Linux only)
train-cpu  = ["torch", "torchvision", "onnx", "matplotlib", "tqdm", "pyffish", "cairosvg", "pyfastnoiselite", "gdown"]
train-cuda = ["torch", "torchvision", "onnx", "matplotlib", "tqdm", "pyffish", "cairosvg", "pyfastnoiselite", "gdown"]
train-rocm = ["torch", "torchvision", "onnx", "pytorch-triton-rocm", "matplotlib", "tqdm", "pyffish", "cairosvg", "pyfastnoiselite", "gdown"]

[project.urls]
Homepage = "https://github.com/lachiewalker/fenrir"
Upstream = "https://github.com/tsoj/Chess_diagram_to_FEN"

[tool.uv]
package = false
conflicts = [
  [
    { extra = "train-cpu" },
    { extra = "train-cuda" },
    { extra = "train-rocm" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",  extra = "train-cpu" },
  { index = "pytorch-cuda", extra = "train-cuda" },
  { index = "pytorch-rocm", extra = "train-rocm" },
]
torchvision = [
  { index = "pytorch-cpu",  extra = "train-cpu" },
  { index = "pytorch-cuda", extra = "train-cuda" },
  { index = "pytorch-rocm", extra = "train-rocm" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm", extra = "train-rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true
